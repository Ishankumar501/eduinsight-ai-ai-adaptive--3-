{% extends "base.html" %}{% block content %}
<div class="card">
<h1>🤖 What do you want to learn?</h1>
<p>Choose any topic. EduInsight will teach it, test you, find weak areas, and adapt the next lesson.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
<label>Topic</label><input name="topic" placeholder="e.g. Recursion, DBMS, Fractions, Python" required>
<button type="submit">Start AI Learning →</button>
</form>
</div>{% endblock %}
